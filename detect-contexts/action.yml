name: 'Detect CI Contexts'
description: 'Parses skaffold.yaml to detect build contexts and languages for CI matrix generation.'
inputs:
  skaffold-file:
    description: 'Path to skaffold.yaml'
    required: false
    default: 'skaffold.yaml'
  only-changed:
    description: >
      Keep only the legs whose skaffold artifacts the commit range touched (changes.py): a push compares the previous
      head, a pull request its merge base, a tag the previous tag. Needs the history (checkout fetch-depth 0).
    required: false
    default: 'false'
  build-all:
    description: 'With only-changed: build every artifact anyway (e.g. after a builder or run-image bump).'
    required: false
    default: 'false'
  always-rebuild-paths:
    description: 'With only-changed: comma or newline separated globs whose change rebuilds every artifact.'
    required: false
    default: ''
outputs:
  matrix:
    description: 'JSON string for GitHub Actions matrix strategy (include)'
    value: ${{ steps.detect.outputs.matrix }}
  languages:
    description: 'Comma-separated list of detected languages'
    value: ${{ steps.detect.outputs.languages }}
  go-version:
    description: "Detected Go version (if any)"
    value: ${{ steps.detect.outputs.go-version }}
  rust-version:
    description: "Detected Rust version (if any)"
    value: ${{ steps.detect.outputs.rust-version }}
  node-version:
    description: "Detected Node version (if any)"
    value: ${{ steps.detect.outputs.node-version }}
  python-version:
    description: "Detected Python version (if any)"
    value: ${{ steps.detect.outputs.python-version }}
  java-version:
    description: "Detected Java version (if any)"
    value: ${{ steps.detect.outputs.java-version }}
  helm-version:
    description: "Set when repo has Helm charts (empty; use chart_paths in pipeline-context for paths)"
    value: ${{ steps.detect.outputs.helm-version }}
  pipeline-context:
    description: "Consolidated CI context object (JSON). Includes matrix, languages, versions, chart_paths, and integration_matrix (build items for CI)."
    value: ${{ steps.detect.outputs.pipeline-context }}
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: bash
      run: pip install pyyaml

    - name: Run detection script
      id: detect
      shell: bash
      env:
        SKAFFOLD_FILE: ${{ inputs.skaffold-file }}
        ONLY_CHANGED: ${{ inputs.only-changed }}
        BUILD_ALL: ${{ inputs.build-all }}
        ALWAYS_REBUILD_PATHS: ${{ inputs.always-rebuild-paths }}
      run: python ${{ github.action_path }}/detect.py
