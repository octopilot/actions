name: 'Release notes'
description: 'Generate release notes from commits since last tag using OpenAI or Anthropic (for GitHub Release body).'
author: 'Octopilot'

inputs:
  version:
    description: 'Release version (e.g. 1.2.3)'
    required: true
  since_tag:
    description: 'Git ref (tag or commit) to list commits after. Default: previous tag from git describe'
    required: false
  template_path:
    description: 'Path to a Markdown template (relative to repo root). Placeholder {{VERSION}} is replaced.'
    required: false
  template:
    description: 'Inline template content. Ignored if template_path is set.'
    required: false
  provider:
    description: 'AI provider: openai or anthropic'
    required: false
    default: 'anthropic'
  model:
    description: 'Model name (e.g. gpt-4o-mini, claude-sonnet-4-5-20250929). Optional; action uses defaults.'
    required: false
  output_filename:
    description: 'Output file name under repo root (e.g. release-body.md)'
    required: false
    default: 'release_notes.md'
  image_registry:
    description: >
      Registry to pull this action's image from, keeping its path
      (ghcr.io/octopilot/actions/release -> <registry>/octopilot/actions/release).
      Default: $OCTOPILOT_IMAGE_REGISTRY, else ghcr.io.
    required: false
    default: ''
  image_tag:
    description: 'Tag of the action image.'
    required: false
    default: 'latest'
outputs:
  body_file:
    description: 'Path to the generated release notes file (relative to repo root)'
    value: ${{ steps.run.outputs.body_file }}
  body:
    description: 'Release notes body content'
    value: ${{ steps.run.outputs.body }}

# Composite rather than `using: docker`: a docker action's image is fixed in this file, so it could not be pulled from
# a mirror. common/run-action-image.sh runs the same image the way the runner runs docker actions.
runs:
  using: 'composite'
  steps:
    - name: Run release
      id: run
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_SINCE_TAG: ${{ inputs.since_tag }}
        INPUT_TEMPLATE_PATH: ${{ inputs.template_path }}
        INPUT_TEMPLATE: ${{ inputs.template }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_OUTPUT_FILENAME: ${{ inputs.output_filename }}
        OCTOPILOT_IMAGE_REGISTRY: ${{ inputs.image_registry || env.OCTOPILOT_IMAGE_REGISTRY }}
        OCTOPILOT_ACTION_IMAGE_TAG: ${{ inputs.image_tag }}
        OCTOPILOT_PASS_ENV: ANTHROPIC_API_KEY OPENAI_API_KEY ANTHROPIC_MODEL OPENAI_MODEL RELEASE_NOTES_PROVIDER
      run: bash "${{ github.action_path }}/../common/run-action-image.sh" octopilot/actions/release
