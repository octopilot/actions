name: 'kubernetes-auth'
description: 'Authenticate with Kubernetes using OIDC'
inputs:
  oidc_url:
    description: 'OIDC provider URL'
    required: true
  oidc_username:
    description: 'OIDC username (Client ID)'
    required: true
  oidc_password:
    description: 'OIDC password (Client Secret)'
    required: true
  k8s_url:
    description: 'Kubernetes API URL'
    required: true
  k8s_namespace:
    description: 'Default namespace'
    required: false
    default: 'default'
  k8s_skip_tls_verify:
    description: 'Skip TLS verification for Kubernetes API'
    required: false
    default: 'false'
  image_registry:
    description: >
      Registry to pull this action's image from, keeping its path
      (ghcr.io/octopilot/actions/kubernetes-auth -> <registry>/octopilot/actions/kubernetes-auth).
      Default: $OCTOPILOT_IMAGE_REGISTRY, else ghcr.io.
    required: false
    default: ''
  image_tag:
    description: 'Tag of the action image.'
    required: false
    default: 'latest'

# Composite rather than `using: docker`: a docker action's image is fixed in this file, so it could not be pulled from
# a mirror. common/run-action-image.sh runs the same image the way the runner runs docker actions.
runs:
  using: 'composite'
  steps:
    - name: Run kubernetes-auth
      id: run
      shell: bash
      env:
        INPUT_OIDC_URL: ${{ inputs.oidc_url }}
        INPUT_OIDC_USERNAME: ${{ inputs.oidc_username }}
        INPUT_OIDC_PASSWORD: ${{ inputs.oidc_password }}
        INPUT_K8S_URL: ${{ inputs.k8s_url }}
        INPUT_K8S_NAMESPACE: ${{ inputs.k8s_namespace }}
        INPUT_K8S_SKIP_TLS_VERIFY: ${{ inputs.k8s_skip_tls_verify }}
        OCTOPILOT_IMAGE_REGISTRY: ${{ inputs.image_registry || env.OCTOPILOT_IMAGE_REGISTRY }}
        OCTOPILOT_ACTION_IMAGE_TAG: ${{ inputs.image_tag }}
      run: bash "${{ github.action_path }}/../common/run-action-image.sh" octopilot/actions/kubernetes-auth
