name: 'Integration build one artifact'
description: >
  Builds one integration matrix item (image via docker or pack, or chart via helm)
  and writes key=value output(s) to a file for the workflow to upload.
inputs:
  from_build_result:
    description: 'build_result.json of an earlier wave (runImage resolution); passed to op --from-build-result.'
    required: false
    default: ''
  artifact:
    description: 'JSON object for one matrix item (type, build_method, context, suffix, output_key, path?, dockerfile?, builder?, build_env?)'
    required: true
  ttl-uuid:
    description: 'UUID for ttl.sh image/chart naming'
    required: true
  output-path:
    description: >
      DEPRECATED — key=value sidecar retained only for legacy direct callers.
      The contract is build_result.json (skaffold build-artifact schema,
      written by op on every build); consume it directly or via
      merge-build-results. The sidecar write will be removed at the next
      major release together with the docker/paketo/helm-to-ttl-sh actions.
    required: false
    default: outputs.txt
  ttl-tag:
    description: 'Tag for ttl.sh when ttl-uuid is set (default 1d).'
    required: false
    default: '1d'
  op_version:
    description: 'Op image version (e.g. v1.2.0). Must be v1.0.17+ for chart artifacts (no run image).'
    required: false
    default: v1.2.0
  docker_host:
    description: 'When set (e.g. tcp://host.docker.internal:2375), op uses this DOCKER_HOST. Use with job-level DinD service when the runner has no Docker socket (required for chart builds).'
    required: false
    default: ''
  cache_image:
    description: >
      Registry image for the pack BUILD cache (e.g.
      ghcr.io/org/myimage-buildcache). Only applied to image artifacts. The
      caller must have already docker-logged-in with push access; leave empty
      on fork PRs. Requires op v1.1.2+ (cache-image registry auth; older op fails UNAUTHORIZED).
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - name: Parse artifact
      id: parse
      shell: bash
      env:
        ARTIFACT: ${{ inputs.artifact }}
      run: |
        set -e
        echo "type=$(echo "$ARTIFACT" | jq -r '.type // ""')" >> "$GITHUB_OUTPUT"
        echo "build_method=$(echo "$ARTIFACT" | jq -r '.build_method // ""')" >> "$GITHUB_OUTPUT"
        echo "context=$(echo "$ARTIFACT" | jq -r '.context // "."')" >> "$GITHUB_OUTPUT"
        echo "suffix=$(echo "$ARTIFACT" | jq -r '.suffix // ""')" >> "$GITHUB_OUTPUT"
        echo "output_key=$(echo "$ARTIFACT" | jq -r '.output_key // ""')" >> "$GITHUB_OUTPUT"
        echo "image=$(echo "$ARTIFACT" | jq -r '.image // ""')" >> "$GITHUB_OUTPUT"
        echo "path=$(echo "$ARTIFACT" | jq -r '.path // ""')" >> "$GITHUB_OUTPUT"
        echo "dockerfile=$(echo "$ARTIFACT" | jq -r '.dockerfile // "Dockerfile"')" >> "$GITHUB_OUTPUT"
        # Same pin as detect-contexts DEFAULT_BUILDER. See
        # octopilot-pipeline-tools/docs/image-launch-and-builder-tags.md.
        echo "builder=$(echo "$ARTIFACT" | jq -r '.builder // "ghcr.io/octopilot/builder-jammy-base:rust-builder-d741287"')" >> "$GITHUB_OUTPUT"
        echo "build_env=$(echo "$ARTIFACT" | jq -r '.build_env // ""')" >> "$GITHUB_OUTPUT"
        echo "run_image=$(echo "$ARTIFACT" | jq -r '.run_image // ""')" >> "$GITHUB_OUTPUT"

    - name: Resolve run image from the earlier wave
      id: runimage
      if: inputs.from_build_result != '' && steps.parse.outputs.run_image != ''
      shell: bash
      env:
        FROM_BUILD_RESULT: ${{ inputs.from_build_result }}
        RUN_IMAGE: ${{ steps.parse.outputs.run_image }}
      run: |
        # op looks up runImage by the exact skaffold string. A published tag
        # (`ghcr.io/org/app-base:latest`) does not equal the artifact name
        # (`app-base`) stored in build_result.json, so hand op that pair.
        base="${RUN_IMAGE##*/}"
        base="${base%%@*}"
        base="${base%%:*}"
        tag="$(jq -r --arg b "$base" '
          .builds[]
          | select((.imageName | split("/")[-1] | split("@")[0] | split(":")[0]) == $b)
          | .tag
        ' "$FROM_BUILD_RESULT" | head -n 1)"
        if [ -z "$tag" ] || [ "$tag" = "null" ]; then
          echo "::warning::no built image named ${base} in ${FROM_BUILD_RESULT}; op will use ${RUN_IMAGE} as written"
          exit 0
        fi
        echo "override=${RUN_IMAGE}=${tag}" >> "$GITHUB_OUTPUT"

    - name: Build and push image (Octopilot)
      id: build
      if: steps.parse.outputs.type == 'image'
      uses: octopilot/actions/octopilot@main
      with:
        ttl-uuid: ${{ inputs.ttl-uuid }}
        ttl-tag: ${{ inputs.ttl-tag }}
        artifact: ${{ steps.parse.outputs.image }}
        artifact_key: ${{ steps.parse.outputs.suffix }}
        op_version: ${{ inputs.op_version }}
        docker_host: ${{ inputs.docker_host }}
        cache_image: ${{ inputs.cache_image }}
        from_build_result: ${{ inputs.from_build_result }}
        run_image_override: ${{ steps.runimage.outputs.override }}

    - name: Build and push chart (Octopilot)
      id: chart_build
      if: steps.parse.outputs.type == 'chart' && steps.parse.outputs.image != ''
      uses: octopilot/actions/octopilot@main
      with:
        ttl-uuid: ${{ inputs.ttl-uuid }}
        ttl-tag: ${{ inputs.ttl-tag }}
        artifact: ${{ steps.parse.outputs.image }}
        artifact_key: ${{ steps.parse.outputs.suffix }}
        op_version: ${{ inputs.op_version }}
        docker_host: ${{ inputs.docker_host }}

    - name: Chart requires skaffold artifact
      if: steps.parse.outputs.type == 'chart' && steps.parse.outputs.image == ''
      shell: bash
      run: |
        echo "::error::Chart build via Octopilot requires the chart to be defined in skaffold build.artifacts (with matching context). Add the chart as an artifact or use a repo where the chart is built by skaffold."
        exit 1

    - name: Write image output file
      if: steps.parse.outputs.type == 'image'
      shell: bash
      run: |
        echo "${{ steps.parse.outputs.output_key }}=${{ steps.build.outputs.tag }}" > "${{ inputs.output-path }}"

    - name: Write chart output file
      if: steps.parse.outputs.type == 'chart' && steps.parse.outputs.image != ''
      shell: bash
      run: |
        echo "${{ steps.parse.outputs.output_key }}=${{ steps.chart_build.outputs.tag }}" > "${{ inputs.output-path }}"
