name: 'Trim artifacts'
description: >
  Reduce the repository's GitHub Actions artifacts to the newest `keep` of each name, before the run uploads its own.
  Artifact storage is one quota per organisation; when it is full every upload in every repository fails. Artifacts
  of this run and of runs still in progress are never deleted. Needs `actions: write` on the job; a failure warns.
inputs:
  keep:
    description: 'Artifacts left per name. 0 turns trimming off.'
    required: false
    default: '3'
  token:
    description: 'Token with actions: write on the repository (another repository needs a token that reaches it).'
    required: false
    default: ${{ github.token }}
  repository:
    description: 'owner/repo to trim. Default: this one.'
    required: false
    default: ${{ github.repository }}
  clear:
    description: "'true': keep 0 deletes every artifact (a one-off clear-down) instead of turning trimming off."
    required: false
    default: 'false'
  dry-run:
    description: "'true': list what would be deleted, delete nothing."
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Trim artifacts
      shell: bash
      env:
        KEEP: ${{ inputs.keep }}
        GITHUB_TOKEN: ${{ inputs.token }}
        TRIM_REPOSITORY: ${{ inputs.repository }}
        CLEAR: ${{ inputs.clear == 'true' && '1' || '' }}
        DRY_RUN: ${{ inputs.dry-run == 'true' && '1' || '' }}
      run: bash "$GITHUB_ACTION_PATH/trim.sh"
