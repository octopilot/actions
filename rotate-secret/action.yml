name: 'rotate-secret'
description: 'Rotate a GitHub repository secret'
inputs:
  secret_name:
    description: 'Name of the secret to update'
    required: true
  secret_value:
    description: 'New value for the secret'
    required: true
  repository:
    description: 'Repository name (owner/repo). Defaults to current repository.'
    required: false
    default: ${{ github.repository }}
  token:
    description: 'GitHub Token with repo scope (or appropriate permissions) to update secrets.'
    required: true
    default: ${{ github.token }}
  image_registry:
    description: >
      Registry to pull this action's image from, keeping its path
      (ghcr.io/octopilot/actions/rotate-secret -> <registry>/octopilot/actions/rotate-secret).
      Default: $OCTOPILOT_IMAGE_REGISTRY, else ghcr.io.
    required: false
    default: ''
  image_tag:
    description: 'Tag of the action image.'
    required: false
    default: 'latest'

# Composite rather than `using: docker`: a docker action's image is fixed in this file, so it could not be pulled from
# a mirror. common/run-action-image.sh runs the same image the way the runner runs docker actions.
runs:
  using: 'composite'
  steps:
    - name: Run rotate-secret
      id: run
      shell: bash
      env:
        INPUT_SECRET_NAME: ${{ inputs.secret_name }}
        INPUT_SECRET_VALUE: ${{ inputs.secret_value }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_TOKEN: ${{ inputs.token }}
        OCTOPILOT_IMAGE_REGISTRY: ${{ inputs.image_registry || env.OCTOPILOT_IMAGE_REGISTRY }}
        OCTOPILOT_ACTION_IMAGE_TAG: ${{ inputs.image_tag }}
      run: bash "${{ github.action_path }}/../common/run-action-image.sh" octopilot/actions/rotate-secret
